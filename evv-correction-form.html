<!-- RETIRED 2026-10-17 (Samantha): the EVV correction form is no longer used. When a caregiver misses a clock-in or
     clock-out, the office calls the client to confirm the times and corrects the visit in AxisCare. This page stays
     only so the links in older texts still open something: no script, no form, nothing is saved or sent. -->
<style>
body{margin:0;font-family:Poppins,Arial,sans-serif;background:#F6F9FD;color:#0D365F}
header{background:#0D365F;color:#fff;padding:1.1rem 1.5rem;font-weight:700}
main{max-width:560px;margin:2rem auto;padding:0 1rem}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(14,56,96,.07);padding:1.4rem 1.5rem}
h1{font-size:1.2rem;margin:0 0 .8rem}
p{line-height:1.6;margin:.6rem 0}
a{color:#2F8F8A;font-weight:600}
</style>
</head>
<body>
<header>Caring Companions</header>
<main>
  <div class="card">
    <h1>We no longer use this form</h1>
    <p>If you forgot to clock in or clock out, please call the office at <a href="tel:4172348494">(417) 234-8494</a>.</p>
    <p>We'll confirm your times with your client and correct your visit in AxisCare. Next time, please clock in and out in the AxisCare app.</p>
    <p>Thank you!</p>
  </div>
</main>
