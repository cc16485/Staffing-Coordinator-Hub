                    items: {}
        '422':
          description: |
            Unprocessable Entity — the request body is syntactically valid but contains invalid field values, or the requested change is not allowed in the visit's current state.

            **Service errors:**
            - `Specify either serviceCode or serviceDescription, not both.`
            - `Unknown serviceCode: {serviceCode}`
            - `Specified serviceCode is not unique: {serviceCode}`
            - `Unknown serviceDescription: {serviceDescription}`
            - `Specified serviceDescription is not unique: {serviceDescription}`

            **Billing errors:**
            - `The billableRateMode property must also have a chargeRate specified`
            - `Invalid mileage: must be a non-negative number or null.`

            **Modification reason errors:**
            - `Invalid modificationReason: {value} is not a number.`
            - `Unknown modificationReason: {value}`

            **ADL state errors** (returned whenever `adls` is present in the request body):
            - `ADLs cannot be modified on a visit that has already started.`
            - `ADLs cannot be modified on a verified visit.`

            **ADL validation errors** (only when the visit has not started and is not verified):
            - `visitDate is required when assigning ADLs to a visit.` — returned only if a visit date cannot be resolved (normally omitted `visitDate` on PATCH is filled from the visit's scheduled day).
            - `ADL with id '{id}' cannot be assigned to this visit`
            - `ADL with adlKey '{key}' cannot be assigned to this visit`
            - `'{adlKey}' ADL is not configured in AxisCare. Customer must add the ADL.`
            - `ADL with id '{id}' is not configured in AxisCare. Customer must add the ADL.`
            - `'adlKey' and 'id' refer to different ADLs.`
            - `Duplicate ADL adlKey in adls list: '{key}'` — returned when the same `adlKey` appears on more than one item in the `adls` array. Only reported for ADLs that are otherwise valid (configured and assignable); unassignable duplicates surface the `cannot be assigned` error instead.
            - `Duplicate ADL id in adls list: {id}` — returned when the same `id` appears on more than one item in the `adls` array. Only reported for ADLs that are otherwise valid (configured and assignable); unassignable duplicates surface the `cannot be assigned` error instead.
            - `JSON errors: {schema validation details}` — returned when the `adls` payload structure does not match the expected schema (e.g. invalid enum values for `require`, unknown properties on an event such as `recur` or `when`, unsupported `translations` language codes such as `fr`, extra properties).

            **Care note errors:**
            - `Care note cannot be modified on a visit that has not started.`
            - `Care note must be a string.`
            - `Care note text cannot be modified on a verified visit.`
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                422 Invalid Mileage:
                  value:
                    errors:
                      - 'Invalid mileage: must be a non-negative number or null.'
                422 Care Note Not Started:
                  value:
                    errors:
                      - Care note cannot be modified on a visit that has not started.
                422 Care Note Not Object:
                  value:
                    errors:
                      - Care note must be a string.
                422 Care Note Verified:
                  value:
                    errors:
                      - Care note text cannot be modified on a verified visit.
                422 Custom Rate Without chargeRate:
                  value:
                    errors:
                      - The billableRateMode property must also have a chargeRate specified
                422 ADLs On Started Visit:
                  value:
                    errors:
                      - ADLs cannot be modified on a visit that has already started.
                422 ADLs On Verified Visit:
                  value:
                    errors:
                      - ADLs cannot be modified on a verified visit.
                422 Duplicate ADL adlKey:
                  value:
                    errors:
                      - 'Duplicate ADL adlKey in adls list: ''bathing'''
                422 Duplicate ADL id:
                  value:
                    errors:
                      - 'Duplicate ADL id in adls list: 5'
                422 ADL Translations Unsupported Language Code:
                  value:
                    errors:
                      - 'JSON errors: Additional object properties are not allowed: fr'
        '500':
          description: |-
            Internal Server Error

            If attempting to add a `chargeRate` and change the `billableRateMode`, and custom bill rate adjustments have not been enabled, you will get an error.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: Internal Server Error
      operationId: patch-api-visits-visitId
      x-stoplight:
        id: wj6d4ycdsv40n
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visitDate:
                  type:
                    - string
                  format: date
                  description: |
                    The new visit date in `YYYY-MM-DD` format.

                    When `adls` is included, weekday codes on ADL events follow this field if present. If you omit `visitDate` and send only `adls`, weekday codes still use the visit's scheduled calendar day without treating this as a visit-date change.
                  example: '2026-04-02'
                startTime:
                  type:
                    - string
                  x-stoplight:
                    id: m0knamf2ss31h
                  example: '09:00'
                  pattern: '\d{2}:\d{2}'
                endTime:
                  type:
                    - string
                  x-stoplight:
                    id: 09de9gtuxh823
                  example: '10:00'
                  pattern: '\d{2}:\d{2}'
                caregiverId:
                  type:
                    - integer
                    - 'null'
                  description: |
                    The ID of the caregiver assigned to the visit. Pass `null` to unassign the caregiver from this visit.
                  x-stoplight:
                    id: w5ar8skbtxd5z
                doNotBill:
                  type:
                    - boolean
                  x-stoplight:
                    id: 1gf3jiwocssn1
                doNotPay:
                  type:
                    - boolean
                  x-stoplight:
                    id: czaqwbwkw813m
                serviceCode:
                  type:
                    - string
                  x-stoplight:
                    id: gjdymw0osf634
                serviceDescription:
                  type:
                    - string
                  x-stoplight:
                    id: 47pxe5nlcnvxy
                mileage:
                  type:
                    - number
                    - 'null'
                  minimum: 0
                  description: Non-negative number or null. Null clears the field.
                  x-stoplight:
                    id: 3kdvxzdjmk7b3
                expenses:
                  type:
                    - number
                  x-stoplight:
                    id: 9kfbbb46bbn3q
                billableRateMode:
                  type:
                    - string
                  x-stoplight:
                    id: 3v6q9cfauhfne
                  enum:
                    - custom
                    - auto
                chargeRate:
                  type:
                    - number
                  x-stoplight:
                    id: dvqipb50jnd17
                  description: Required when `billableRateMode` is `custom`.
                modificationReason:
                  type:
                    - integer
                  description: |
                    The ID of a modification reason. Must reference an active modification reason configured in AxisCare.

                    **May be mandatory.** When the *Require modification reasons* option is enabled in System Preferences, a modification reason must be supplied whenever a visit is edited (unless the visit already has a modification reason stored). If it is required but omitted, the request fails with `400 Bad Request` and the error `A modification reason is required.` When the preference is disabled, this field is optional.
                adls:
                  type:
                    - array
                    - string
                  description: |
                    Optional ADL (Activities of Daily Living) assignments for the visit.

                    **Only allowed when the visit has not yet started and is not verified.** If the visit has already started or is verified, including `adls` in the request returns a `400` error (`ADLs cannot be modified on a visit that has already started.` or `ADLs cannot be modified on a verified visit.`).

                    Accepts one of three forms:
                    - **Array of ADL objects** — assigns exactly these ADLs to the visit, overriding any inherited assignments.
                    - **Empty array `[]`** — explicitly assigns no ADLs (overrides schedule/client inheritance with zero ADLs).
                    - **String `"inherit"`** — removes any visit-level ADL overrides so the visit inherits ADLs from its schedule or client.

                    **Validation rules:**
                    - Each ADL object must include either `adlKey` or `id` (or both). When both are provided, they must refer to the same ADL definition.
                    - `adlKey` and `id` values must each be unique within the `adls` list; the same ADL cannot be assigned more than once on a single visit.
                    - Each ADL object must include at least one `events` entry.
                    - Each event's stored weekday code is taken from `visitDate` when you include it in this request, otherwise from the visit's scheduled calendar day. Do not send `recur` on events; it is not accepted.
                    - Each ADL must be assignable to the visit based on the client and service configuration.
                    - `translations` values are only persisted when `instructions` is also provided.
                  items:
                    type: object
                    properties:
                      adlKey:
                        type: string
                        minLength: 1
                        description: The unique ADL key identifier (e.g. `bathing`, `errands`). At least one of `adlKey` or `id` is required.
                      id:
                        type: integer
                        minimum: 1
                        description: The ADL definition ID. At least one of `adlKey` or `id` is required.
                      instructions:
                        type:
                          - string
                          - 'null'
                        description: Free-text instructions for the caregiver. Required if `translations` are provided.
                      events:
                        type: array
                        minItems: 1
                        description: Scheduling events for the ADL. At least one event is required.
                        items:
                          type: object
                          properties:
                            require:
                              type: integer
                              enum:
                                - 1
                                - 2
                              description: 'Requirement level. 1 = Always required (default), 2 = As needed.'
                              default: 1
                          additionalProperties: false
                      translations:
                        type: object
                        description: 'Instruction translations keyed by language code. Only saved when `instructions` is also provided. Only the supported language codes (`es`, `zh-CN`, `zh-TW`, `ru`) are allowed; sending any other key returns a `400` error.'
                        properties:
                          es:
                            type:
                              - string
                              - 'null'
                            description: Instructions in Spanish
                          zh-CN:
                            type:
                              - string
                              - 'null'
                            description: Instructions in Chinese (Simplified)
                          zh-TW:
                            type:
                              - string
                              - 'null'
                            description: Instructions in Chinese (Traditional)
                          ru:
                            type:
                              - string
                              - 'null'
                            description: Instructions in Russian
                        additionalProperties: false
                    required:
                      - events
                careNote:
                  type: string
                  description: |
                    Update the care note text for this visit.

                    **The visit must have already started** — attempting to modify `careNote` on a visit that has not started returns a `400` error.

                    Cannot be modified on a verified visit (returns `400`).

                    **Note:** Care notes are scoped by client, caregiver, and visit date — not by individual visit. Updating `careNote` on one visit also updates it on every other visit that shares the same client, caregiver, and visit date.
            examples:
              Update times:
                value:
                  startTime: '09:00'
                  endTime: '11:00'
              Update with ADLs:
                value:
                  adls:
                    - adlKey: bathing
                      instructions: Assist client with shower
                      events:
                        - require: 1
              Add care note:
                value:
                  careNote: Client was in good spirits today.
      description: |-
        This endpoint allows you to modify an existing visit by its ID (e.g. `s=222:d=2024-03-04`). You can supply a partial payload of only the keys you want to update. To unassign the caregiver from the visit, pass `null` for `caregiverId`. You may specify *either* a service code *or* a description, but not both.  It also supports a custom billable rate property that you add to the request body:

        `"billableRateMode": "custom"`.

        When using the custom billable mode, you will need to provide a `chargeRate`:

        `"chargeRate": 120.45`

        ### ADL Assignments

        You may include an `adls` field to assign Activities of Daily Living to the visit.

        **ADL modifications are only allowed when the visit has not yet started and is not verified.** If the visit has already started or is verified, including `adls` in the request returns a `400` error.

        Three modes are supported:

        | Value | Behavior |
        |---|---|
        | Array of ADL objects | Assigns exactly these ADLs, overriding inherited assignments |
        | Empty array `[]` | Explicitly assigns no ADLs (overrides inheritance) |
        | String `"inherit"` | Removes visit-level overrides; visit inherits ADLs from schedule or client |

        **ADL payload rules (when applied):** Same shape and validation as `POST /api/visits` — include `events` with `require` only; weekday codes are derived from `visitDate` in the body when present, otherwise from the visit's scheduled day.

        ### Care Notes

        You may include a `careNote` string to update the visit's care note text.

        **Requirements:**
        - The visit must have **already started** — attempting to modify `careNote` on a future visit returns a `400` error.
        - The note **cannot** be modified on a verified visit (returns `400`).

        **Scope:** Care notes are stored per client, caregiver, and visit date — not per individual visit. Updating `careNote` on one visit also updates it on every other visit that shares the same client, caregiver, and visit date.
      parameters:
        - schema:
            type: string
            format: date
            enum:
              - '2023-10-01'
