      operationId: get-api-schedules
      description: |-
        This endpoint allows you to list schedules and filter them by various values. The filters work in an "AND" fashion, so the schedule must match all the requested filters in order to be returned.

        If more results match than what the endpoint is set to return, a URL to the next page of results will be provided in the response.

        Only schedules belonging to active clients are returned by this endpoint. Requesting a schedule for an inactive client via scheduleIds returns 404. The caregiver field is null when the schedule has no assigned caregiver or the assigned caregiver is not active.
      parameters:
        - schema:
            type: string
            enum:
              - '2023-10-01'
          in: header
          name: X-AxisCare-Api-Version
          description: API Version
          required: true
        - schema:
            type: string
            example: '2024-01-01'
            format: date
          in: query
          name: startDate
          description: Schedule start date localized to visit timezone. Required with endDate if scheduleIds are not provided
        - schema:
            type: string
            format: date
            example: '2024-02-01'
          in: query
          name: endDate
          description: Schedule end date localized to visit timezone. Required with startDate if scheduleIds are not provided
        - schema:
            type: string
            example: '"1,2,3"'
          in: query
          name: scheduleIds
          description: Comma-delimited string of schedule IDs to filter visit result set. Required if startDate and endDate are not provided.
        - schema:
            type: string
            example: '"1,2,3"'
          in: query
          name: clientIds
          description: Comma-delimited string of client IDs to filter visit result set
        - schema:
            type: string
            example: '"1,2,3"'
          in: query
          name: caregiverIds
          description: Comma-delimited string of caregiver IDs to filter visit result set
        - schema:
            type: string
          in: query
          name: serviceCode
          description: Service Code to filter by. Both a serviceCode and a serviceDefinition cannot be provided.
        - schema:
            type: string
          in: query
          description: Service Description to filter by. Both a serviceCode and a serviceDefinition cannot be provided.
          name: serviceDescription
      requestBody:
        content: {}
        description: ''
