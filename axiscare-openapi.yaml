webhooks:
  # Named, not a path template: OAS 3.1 `webhooks` keys are unique names, so
  # braces here would be read as an (undefined) path parameter. The substitutable
  # endpoint lives on "Webhook - Trigger Your Endpoint" as the `Your-Endpoint`
  # server variable.
  https://your-subscription-endpoint.com:
    post:
      summary: Webhook Events
      description: |
        ## Overview

        The AxisCare webhook system empowers you to receive real-time notifications for specific events occurring within your AxisCare account. Whenever an event is triggered, AxisCare sends a detailed HTTP POST request to the designated URL, keeping you instantly informed and enabling seamless integration with your workflows.

        [TEST - Trigger your webhook subscription endpoint](/api/documentation.html#/operations/webhooks.receive)

        [Webhooks User Guide](/?/admin/webhook-user-guide)

        ### Important Notes
        - **Webhook Subscriber Admin configuration is not available by default. Please contact AxisCare support to enable this feature for your account.**
        - The URL you provide must be able to handle incoming POST requests with JSON payloads and Respond with a 200 or 202.
        - We recommend implementing logging and error handling in your webhook endpoint to capture any issues with processing incoming requests.
        - Webhook events are sent in JSON format and include details about the event, such as the type of event, a description, and relevant data about the entity that was affected.

        ## Available Events

        Currently supported webhook events:

        | Event | Description |
        |-------|-------------|
        | `client.created` | Triggered when a new client is added to your AxisCare account |
        | `client.updated` | Triggered when an existing client's information is modified |
        | `caregiver.created` | Triggered when a new caregiver is added to your AxisCare account |
        | `caregiver.updated` | Triggered when an existing caregiver's information is modified |
        | `lead.created` | Triggered when a new lead is added to your AxisCare account |
        | `lead.updated` | Triggered when an existing lead's information is modified |
        | `applicant.created` | Triggered when a new applicant submits an application |
        | `applicant.updated` | Triggered when an existing applicant's information is modified |
        | `calllog.created` | Triggered when a new call log was created |
        | `calllog.updated` | Triggered when existing call log's information is modified |
        | `scheduling.visit.adls.add` | An ADL was added to the visit |
        | `scheduling.visit.adls.edit` | An ADL was edited on the visit |
        | `scheduling.visit.adls.remove` | An ADL was removed from the visit |  
        | `scheduling.visit.adlsAutoCompleted` | ADLs were auto-completed for the visit |
        | `scheduling.visit.billableRate.updated` | The visit billable rate was changed |
        | `scheduling.visit.billable` | The visit billable status was changed |
        | `scheduling.visit.call.clockIn` | A telephony clock in was recorded for the visit |
        | `scheduling.visit.call.clockOut` | A telephony clock out was recorded for the visit |
        | `scheduling.visit.caregiverSignature` | The caregiver signed the visit |
        | `scheduling.visit.caregiver` | The visit caregiver assignment was changed |
        | `scheduling.visit.clientSignature` | The client signed the visit |
        | `scheduling.visit.clientVoice.confirmed` | A voice confirmation was recorded for the visit |
        | `scheduling.visit.clockIn.location` | The visit clock in location was recorded |
        | `scheduling.visit.clockOut.location` | The visit clock out location was recorded |
        | `scheduling.visit.clockedIn` | The visit clock in time was changed |
        | `scheduling.visit.clockedOut` | The visit clock out time was changed |
        | `scheduling.visit.created` | A new visit was created |
        | `scheduling.visit.createdByCopy` | A visit was created by copying an existing visit |
        | `scheduling.visit.createdFromSchedule` | A visit was created from a schedule |
        | `scheduling.visit.customBillRateMode` | The visit custom bill rate mode was enabled |
        | `scheduling.visit.customPayableMode` | The visit custom payable mode was enabled |
        | `scheduling.visit.date` | The visit date was changed |
        | `scheduling.visit.endTime` | The visit end time was changed |
        | `scheduling.visit.expenses` | The visit expenses were changed |
        | `scheduling.visit.mileage` | The visit mileage was changed |
        | `scheduling.visit.moved` | The visit was moved to a different date or time |
        | `scheduling.visit.payable` | The visit payable status was changed |
        | `scheduling.visit.payRate` | The visit pay rate was changed |
        | `scheduling.visit.remove` | The visit was removed |
        | `scheduling.visit.startTime` | The visit start time was changed |
        | `scheduling.visit.type` | The visit type was changed (Daily/Hourly/Fixed) |
        | `scheduling.visit.verify` | The visit was verified |
        | `recurring_schedule.created` | Triggered when a new recurring schedule is added to your AxisCare account |
        | `recurring_schedule.deleted` | Triggered when an existing recurring schedule is deleted |
        | `recurring_schedule.updated` | Triggered when existing recurring schedule's information is modified |

        ## Security Requirements

        - All webhook URLs **must** use HTTPS
        - Requests include these headers:
          - `content-type: application/json`
          - `user-agent: AWS-Webhook-Service`
          - `x-webhook-id: <unique-webhook-id>`

        ## Expected Response

        Your endpoint should:
        - Respond with HTTP status codes 200 or 202 for successful processing
        - Respond within 5 seconds
        - Return any status code outside 200-299 if you want the webhook retried

        ## Delivery Guarantees

        - Maximum of 3 retry attempts per webhook
        - 10-second timeout per delivery attempt

        ## Webhook Testing Tools
        ### These tools can help you test your webhook endpoint and ensure it is receiving and processing events correctly.

        - [webhook.site](https://webhook.site/) for quick testing of webhook payloads
        - [RequestBin](https://requestbin.com/) to inspect webhook payloads and headers
      operationId: webhooks.schema
      x-stoplight:
        id: webhook-schema
      tags:
        - Webhooks
      parameters:
        - name: content-type
          in: header
          required: true
          schema:
            type: string
            default: application/json
        - name: user-agent
          in: header
          required: true
          schema:
            type: string
            default: AWS-Webhook-Service
        - name: x-webhook-id
          in: header
          required: true
          schema:
            type: string
            default: unique-subscriber-id-provided-by-axiscare
            description: Unique identifier given to the Subscriber in AxisCare
      requestBody:
        description: Webhook payload sent by AxisCare
        required: true
        content:
          application/json:
            schema:
              $ref: ../Webhook.yaml
            examples:
              client-updated:
                summary: Client Updated Event
                value:
                  event: client.updated
                  description: An existing client was updated.
                  data:
                    entity: client
                    action: updated
                    id: '1001'
                  timestamp: '2025-06-17T14:05:45-05:00'
                  publisher_url: https://654321.axiscare.com/
              applicant-created:
                summary: Applicant Created Event
                value:
                  event: applicant.created
                  description: A new applicant was added.
                  data:
                    entity: applicant
                    action: created
                    id: '31313'
                  timestamp: '2025-06-24T11:09:22-04:00'
                  publisher_url: https://654321.axiscare.com/
      responses:
        '200':
          description: |
            - **REQUIRED** 200 or 202 Successful response status code to acknowledge receipt of the webhook.
            - This indicates that your endpoint has successfully received and processed the webhook event.
        '400':
          description: |
            - 400+ Bad Request response will to indicate an error with the webhook reception or processing.
            - A new POST webhook will be retried up to 3 times if it fails with a status code outside the 200-299 range.
            - **Too many Bad Request responses will result in the Subscriber being disabled.**
      security: []
