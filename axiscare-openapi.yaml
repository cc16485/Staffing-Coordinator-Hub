    post:
      summary: Add Contact
      operationId: contacts.add
      tags:
        - Contacts
      description: |
        This endpoint allows you to create a contact. `firstName` and `lastName` are required.
        All other fields are optional. Unknown properties are rejected.

        `contactClass` may be a single configured class code or multiple codes separated by `|` (pipe),
        e.g. `Case Manager|Discharge Planner`, consistent with the web UI.
        Returns `null` in responses when the contact has no class assigned or when the site has no contact classes configured.

        `clients` and `leads` are managed through the Linked Contacts feature and are read-only from Customer API responses.
        No Customer API endpoint exists to add or remove those Linked Contacts; use the AxisCare web UI.

        `caregivers` and `applicants` can be linked using separate APIs for those resources:
        - Caregivers: [Update Caregiver](/api/documentation.html#/operations/patch-api-caregivers-caregiverId) and set `referredBy` (`type: "contact"`, contact `id`/`name`)
        - Applicants: [Create Applicant](/api/documentation.html#/operations/post-api-applicants) and set `referredBy` (`type: "contact"`, contact `id`/`name`)

        **Atomicity note:** The create operation is not fully atomic. The contact row and its dependent
        data (EAV fields, messaging subscriptions, etc.) are written across two independent database
        connections. If a failure occurs mid-write, a partial contact record may persist. Connected-contact
        links (`connectedContacts`) are applied after the main write and may also partially succeed.
      parameters:
        - schema:
            type: string
            format: date
            enum:
              - '2023-10-01'
          in: header
          name: X-AxisCare-Api-Version
          description: API version
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - firstName
                - lastName
              properties:
                firstName:
                  type: string
                  minLength: 1
                  description: First name of the contact
                lastName:
                  type: string
                  minLength: 1
                  description: Last name of the contact
                goesBy:
                  type: ['string', 'null']
                  description: Preferred name or nickname
                gender:
                  description: Gender of the contact. Must be 'M' or 'F' (or null).
                  oneOf:
                    - type: 'null'
                    - type: string
                      enum:
                        - M
                        - F
                dateOfBirth:
                  type: ['string', 'null']
                  format: date
                  description: Date of birth in YYYY-MM-DD format
                  examples:
                    - '1965-03-15'
                contactClass:
                  type: ['string', 'null']
                  description: >
                    One or more contact class codes configured for the site. Use a single code (e.g. `Physician`)
                    or several separated by `|` (e.g. `Case Manager|Discharge Planner`), matching the web UI
                    multi-select. Each segment must be a valid code; empty segments are not allowed.
                status:
                  description: >
                    Optional status object. `label` must match a configured contact status for the selected
                    `active` group. If omitted or null, the contact is created as Active.
                  oneOf:
                    - type: 'null'
                    - type: object
                      required: [active, label]
                      additionalProperties: false
                      properties:
                        active:
                          type: boolean
                        label:
                          type: string
                          minLength: 1
                email:
                  type: ['string', 'null']
                  description: Email address
                physicalAddress:
                  type: object
                  description: Physical address of the contact
                  additionalProperties: false
                  properties:
                    address1:
                      type: ['string', 'null']
                    address2:
                      type: ['string', 'null']
                    city:
                      type: ['string', 'null']
                    state:
                      type: ['string', 'null']
                    zip:
                      type: ['string', 'null']
                mailingAddress:
                  type: object
                  description: Mailing address of the contact
                  additionalProperties: false
                  properties:
                    address1:
                      type: ['string', 'null']
                    address2:
                      type: ['string', 'null']
                    city:
                      type: ['string', 'null']
                    state:
                      type: ['string', 'null']
                    zip:
                      type: ['string', 'null']
                phoneOffice:
                  type: ['string', 'null']
                  description: Office phone number
                phoneOfficeExt:
                  type: ['string', 'null']
                  description: Office phone extension
                phoneDirectLine:
                  type: ['string', 'null']
                  description: Direct line phone number
                phoneFax:
                  type: ['string', 'null']
                  description: Fax number
                phoneMobile:
                  type: ['string', 'null']
                  description: Mobile phone number
                connectedContacts:
                  type: array
                  description: >
                    Array of existing contacts to link. Each item must include either `id` or both
                    `firstName` and `lastName`. An optional `affiliation` describes the relationship.
                    Each linked contact may appear at most once; duplicate entries (whether by `id`,
                    by name, or by mixing the two so that they resolve to the same contact) are
                    rejected with a 422.
                  items:
                    type: object
                    additionalProperties: false
                    anyOf:
                      - required: [id]
                      - required: [firstName, lastName]
                    properties:
                      id:
                        type: integer
                        minimum: 1
                      firstName:
                        type: string
                        minLength: 1
                      lastName:
                        type: string
                        minLength: 1
                      affiliation:
                        type: ['string', 'null']
                        description: Description of the relationship (e.g. Colleague, Physicians Assistant)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    $ref: ../Contact.yaml
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                201 Response:
                  value:
                    results:
                      id: 42
                      firstName: James
                      lastName: Marshall
                      goesBy: Dr. Marshall
                      gender: M
                      dateOfBirth: '1965-03-15'
                      contactClass: Physician
                      status:
                        active: true
                        label: Active
                      contactStatus: Active
                      email: dr.marshall@example.com
                      physicalAddress:
                        address1: 100 Hillcrest Medical Blvd
                        address2: Suite 102
                        city: Waco
                        state: Texas
                        zip: '76712'
                      mailingAddress:
                        address1: null
                        address2: null
                        city: null
                        state: null
                        zip: null
                      phoneOffice: '254-555-1234'
                      phoneOfficeExt: null
                      phoneDirectLine: null
                      phoneFax: null
                      phoneMobile: null
                      connectedContacts: []
                      useOrganizationId: null
                      clients: []
                      leads: []
                      caregivers: []
                      applicants: []
                    errors: []
        '401':
          description: |
            Unauthorized — the `Authorization: Bearer …` token could not be authenticated (for example
            unknown secret, **Token not found**, expired token, revoked token, or invalid secret)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  success:
                    type: boolean
                  errors:
                    type: object
                    properties:
                      error:
                        type: string
                        description: Single error message from token authentication.
                    additionalProperties: true
              examples:
                401 Response - Token not found:
                  value:
                    results: null
                    success: false
                    errors:
                      error: Token not found
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                403 Response:
                  value:
                    results: null
                    errors:
                      - You do not have permission to create contacts.
        '422':
          description: |
            Unprocessable Entity — the request could not be processed. Returned when the request body
            cannot be parsed as JSON or did not decode to a JSON object, when JSON schema validation fails,
            when association references cannot be resolved, when `connectedContacts` contains duplicate
            entries that resolve to the same contact, when `firstName` or `lastName` is empty after
            trimming, when the full name duplicates an existing contact, or for other field-level
            validation errors (see operation description).
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                422 Response - Invalid JSON:
                  value:
                    results: null
                    errors:
                      - 'Cannot parse request body: invalid JSON.'
                422 Response - Invalid date of birth:
                  value:
                    results: null
                    errors:
                      - 'Invalid dateOfBirth format. Expected YYYY-MM-DD.'
                422 Response - Invalid status label:
                  value:
                    results: null
                    errors:
                      - "Invalid status.label 'Pending' for status.active=true."
                422 Response - Invalid status type:
                  value:
                    results: null
                    errors:
                      - 'Invalid input: /status must be object or null.'
                422 Response - Unknown address property:
                  value:
                    results: null
                    errors:
                      - "Invalid input: /physicalAddress contains an unknown property 'country'. Allowed properties are: address1, address2, city, state, zip."
                422 Response - Duplicate full name:
                  value:
                    results: null
                    errors:
                      - The name Jane Doe already exists. Please add an initial or other identifier to this name.
                422 Response - Duplicate connectedContacts:
                  value:
                    results: null
                    errors:
                      - 'Duplicate connectedContacts entries for contact ID(s): 500.'
        '500':
          description: |
            Internal Server Error — the server could not complete the request.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                500 Response:
                  value:
                    - An internal server error occurred.
