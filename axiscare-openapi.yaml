  /api/taggingCategories:
    get:
      summary: List Tagging Categories
      operationId: get-tagging-categories
      tags:
        - Tagging Categories
      description: |
        This endpoint returns all tagging categories and their IDs. Tagging categories can be attached to Notes and Tasks as organizational identifiers.
      parameters:
        - schema:
            type: string
            format: date
            enum:
              - '2023-10-01'
          in: header
          name: X-AxisCare-Api-Version
          description: API version
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          $ref: ../TaggingCategory.yaml
                  success:
                    type: boolean
                  errors:
                    type: array
              examples:
                Example 1:
                  value:
                    results:
                      categories:
                        - id: 1
                          name: Incident Report
                        - id: 2
                          name: Extra Shifts
                        - id: 3
                          name: Client Complaints
                    success: true
                    errors: []
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                Example 1:
                  value:
                    results: null
                    success: false
                    errors:
                      - Forbidden
