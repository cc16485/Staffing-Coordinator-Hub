    get:
      summary: List Client ADLs
      description: |
        Retrieves a paginated list of all Activities of Daily Living (ADLs) assigned to a specific client.

        ADLs represent tasks and activities that caregivers are expected to assist the client with during visits. Each ADL includes scheduling information (events) that specify when and how often the activity should be performed.

        Key features:
        - **Cursor-based pagination** using `startAfterId` and `limit` query parameters
        - Results are always sorted by ADL ID in ascending order
        - A `nextPage` URL is provided when more results are available
        - Default page size is 100, maximum is 500

        Event fields:
        - **require**: 1 = Always required, 2 = As needed, 3 = Never
        - **recur**: Day of week (N = Sunday, M = Monday, T = Tuesday, W = Wednesday, R = Thursday, F = Friday, S = Saturday)
        - **when**: 0 = Any time, 1 = Morning, 2 = Afternoon, 3 = Evening, 4 = Night
        - **frequency**: Derived label (always, as_needed, never, specific_time)
        - **time_period**: Derived label (any_time, morning, afternoon, evening, night)
      tags:
        - Clients
      operationId: clients.adls.list
      parameters:
        - schema:
            type: string
            enum:
              - '2023-10-01'
            format: date
          in: header
          name: X-AxisCare-Api-Version
          description: API version
          required: true
        - schema:
            type: integer
          in: query
          name: startAfterId
          description: Used in pagination to specify the ADL ID after which to start the next page
        - schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
          in: query
          name: limit
          description: Limit the number of ADLs returned per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      data:
                        type: array
                        description: Array of ADL objects assigned to the client
                        items:
                          $ref: ../ClientADL.yaml
                      nextPage:
                        type:
                          - string
                          - 'null'
                        description: 'If more results exist beyond the current page, a URL to the next page of results will be provided here. Null when there are no more results.'
                  success:
                    type: boolean
                  errors:
                    type: array
              examples:
                200 Response:
                  value:
                    results:
                      data:
                        - id: 1
                          key: bathing
                          name: Bathing
                          category: Personal Care
                          instructions: Assist with bathing
                          events:
                            - require: 1
                              recur: M
                              when: 1
                              frequency: specific_time
                              time_period: morning
                        - id: 2
                          key: dressing
                          name: Dressing
                          category: Personal Care
                          instructions: null
                          events:
                            - require: 1
                              recur: M
                              when: 0
                              frequency: always
                              time_period: any_time
                      nextPage: 'https://agency.axiscare.com/api/clients/1/adls?startAfterId=2&limit=2'
                    success: true
                    errors: []
                200 Response - Last Page:
                  value:
                    results:
                      data:
                        - id: 3
                          key: laundry
                          name: Laundry
                          category: Household
                          instructions: Wash and fold
                          events:
                            - require: 1
                              recur: W
                              when: 0
                              frequency: always
                              time_period: any_time
                      nextPage: null
                    success: true
                    errors: []
        '400':
          description: Bad Request - Invalid limit parameter (must be between 1 and 500)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  success:
                    type: boolean
                  errors:
                    type: array
              examples:
                400 Response:
                  value:
                    results: null
                    success: false
                    errors: ['Limit must be between 1 and 500.']
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  success:
                    type: boolean
                  errors:
                    type: array
              examples:
                403 Response:
                  value:
                    results: null
                    success: false
                    errors: [You don't have permission to view this resource.]
        '404':
