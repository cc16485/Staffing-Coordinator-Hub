    patch:
      summary: Update Contact
      operationId: patch-api-contacts-contactId
      description: |
        Partially updates an existing contact. Only the JSON properties included in the request body are applied; omit a field to leave it unchanged.

        The body must contain at least one editable property (`{}` is rejected). Fields use the same rules as `POST /api/contacts` when present. `firstName` and `lastName` are not required for PATCH.

        If `connectedContacts` is included, it **replaces** the contact’s linked connected contacts entirely: omit the property to leave links unchanged; send `[]` to remove all connections. Each element follows the same shape as create (`id`, or both `firstName` and `lastName`, optional `affiliation`). To change an already-linked contact's `affiliation`, first remove it (PATCH an array that omits it), then re-add it with the new `affiliation` in a follow-up request.

        `contactClass` may be a single code or multiple pipe-separated (`|`) codes, matching the web UI and `POST /api/contacts`. Returns `null` in responses when the contact has no class assigned or when the site has no contact classes configured.

        `clients` and `leads` are linked through the Linked Contacts feature and are read-only in Customer API responses.
        No Customer API endpoint exists to add or remove those Linked Contacts; use the AxisCare web UI.

        `caregivers` and `applicants` can be linked using separate APIs for those resources:
        - Caregivers: [Update Caregiver](/api/documentation.html#/operations/patch-api-caregivers-caregiverId) and set `referredBy` (`type: "contact"`, contact `id`/`name`)
        - Applicants: [Create Applicant](/api/documentation.html#/operations/post-api-applicants) and set `referredBy` (`type: "contact"`, contact `id`/`name`)

        **Atomicity note:** The update operation is not fully atomic. Contact fields and their dependent
        data are written across two independent database connections. If a failure occurs mid-write,
        some fields may be persisted while others are not. Connected-contact links (`connectedContacts`)
        are applied after the main field update and may also partially succeed.
      tags:
        - Contacts
      parameters:
        - schema:
            type: string
            format: date
            enum:
              - '2023-10-01'
          in: header
          name: X-AxisCare-Api-Version
          description: API version
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                firstName:
                  type: string
                  minLength: 1
                  description: First name of the contact
                lastName:
                  type: string
                  minLength: 1
                  description: Last name of the contact
                goesBy:
                  type: ['string', 'null']
                  description: Preferred name or nickname
                gender:
                  description: Gender of the contact. Must be 'M' or 'F' (or null).
                  oneOf:
                    - type: 'null'
                    - type: string
                      enum:
                        - M
                        - F
                dateOfBirth:
                  type: ['string', 'null']
                  format: date
                  description: Date of birth in YYYY-MM-DD format
                  examples:
                    - '1965-03-15'
                contactClass:
                  type: ['string', 'null']
                  description: >
                    One or more contact class codes configured for the site. Use a single code or several
                    separated by `|` (pipe), matching `POST /api/contacts`. Each segment must be a valid code.
                status:
                  oneOf:
                    - type: 'null'
                    - type: object
                      required:
                        - active
                        - label
                      additionalProperties: false
                      properties:
                        active:
                          type: boolean
                        label:
                          type: string
                          minLength: 1
                  description: >
                    Structured status object. `active` controls binary status, and `label` sets the
                    configured display label for that state.
                email:
                  type: ['string', 'null']
                  description: Email address
                physicalAddress:
                  type: object
                  description: Physical address of the contact
                  additionalProperties: false
                  properties:
                    address1:
                      type: ['string', 'null']
                    address2:
                      type: ['string', 'null']
                    city:
                      type: ['string', 'null']
                    state:
                      type: ['string', 'null']
                    zip:
                      type: ['string', 'null']
                mailingAddress:
                  type: object
                  description: Mailing address of the contact
                  additionalProperties: false
                  properties:
                    address1:
                      type: ['string', 'null']
                    address2:
                      type: ['string', 'null']
                    city:
                      type: ['string', 'null']
                    state:
                      type: ['string', 'null']
