        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      organizations:
                        type: array
                        items:
                          $ref: ../Organization.yaml
                      nextPage:
                        type:
                          - string
                          - 'null'
                        description: 'If more results match than what the endpoint is set to return, a URL to the next page of results will be provided here.'
                      organizationsNotFound:
                        type: array
                        items:
                          type: integer
                        description: IDs from the organizationIds filter that were not found
                  errors:
                    type: array
                    items:
                      type: string
