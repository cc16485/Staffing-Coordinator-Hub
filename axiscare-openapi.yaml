  /api/contacts:
    get:
      summary: List Contacts
      operationId: get-contacts
      tags:
        - Contacts
      description: |
        This endpoint allows you to list contacts and filter them.

        If more results match than what the endpoint is set to return, a URL to the next page of results will be provided in the response.

        Each contact’s `contactClass` may be a single code or several codes joined with `|` (pipe), matching the web UI multi-select and `POST /api/contacts`. Returns `null` when the contact has no class assigned or when the site has no contact classes configured.

        The `clients` and `leads` arrays in contact responses are linked through the Linked Contacts feature and are read-only in the Customer API.
        No Customer API endpoint exists to manage Linked Contacts; use the AxisCare web UI to add or remove those links.

        `caregivers` and `applicants` can be linked using the resource-specific APIs:
        - Caregivers: [Update Caregiver](/api/documentation.html#/operations/patch-api-caregivers-caregiverId) using `referredBy` (`type: "contact"` + contact `id`/`name`)
        - Applicants: [Create Applicant](/api/documentation.html#/operations/post-api-applicants) using `referredBy` (`type: "contact"` + contact `id`/`name`)
      parameters:
        - schema:
            type: string
          in: query
          name: contactIds
          description: Comma-delimited string of contact IDs to return
        - schema:
            type: string
          in: query
          name: statuses
          description: Comma-delimited string of statuses to filter by (e.g. Active,Inactive)
        - schema:
            type: integer
          in: query
          name: startAfterId
          description: Used in pagination to specify the contact ID after which to start the next page
        - schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
          in: query
          name: limit
          description: Limit the number of contacts returned
        - schema:
            type: string
            format: date
            enum:
              - '2023-10-01'
          in: header
          name: X-AxisCare-Api-Version
          description: API version
          required: true
      responses:
        '200':
          description: OK — every requested contact id was returned, or the request was not limited to explicit ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      contacts:
                        type: array
                        items:
                          $ref: ../Contact.yaml
                      nextPage:
                        type: ['string', 'null']
                        description: URL to the next page of results, or null if there are no more results
                  errors:
                    type: array
              examples:
                200 Response:
                  value:
                    results:
                      contacts:
                        - id: 1
                          firstName: James
                          lastName: Marshall
                          goesBy: Dr. Marshall
                          gender: M
                          dateOfBirth: '1965-03-15'
                          contactClass: Physician
                          status:
                            active: true
                            label: Active
                          contactStatus: Active
                          email: dr.marshall@example.com
                          physicalAddress:
                            address1: 100 Hillcrest Medical Blvd
                            address2: Suite 102
                            city: Waco
                            state: Texas
                            zip: '76712'
                          mailingAddress:
                            address1: null
                            address2: null
                            city: null
                            state: null
                            zip: null
                          phoneOffice: '254-555-1234'
                          phoneOfficeExt: null
                          phoneDirectLine: null
                          phoneFax: null
                          phoneMobile: null
                          useOrganizationId: null
                          connectedContacts: []
                          clients:
                            - id: 1
                              firstName: John
                              lastName: Doe
                          leads: []
                          caregivers: []
                          applicants: []
                      nextPage: null
                    errors: []
        '207':
          description: Multi-Status — partial success when some requested `contactIds` were not found (same `results` / `errors` envelope as 200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      contacts:
                        type: array
                        items:
                          $ref: ../Contact.yaml
                      nextPage:
                        type: ['string', 'null']
                        description: URL to the next page of results, or null if there are no more results
                      contactsNotFound:
                        type: array
                        description: List of contact IDs that were requested but not found
                        items:
                          type: integer
                  errors:
                    type: array
              examples:
                207 Response:
                  value:
                    results:
                      contacts:
                        - id: 1
                          firstName: James
                          lastName: Marshall
                          goesBy: Dr. Marshall
                          gender: M
                          dateOfBirth: '1965-03-15'
                          contactClass: Physician
                          status:
                            active: true
                            label: Active
                          contactStatus: Active
                          email: dr.marshall@example.com
                          physicalAddress:
                            address1: 100 Hillcrest Medical Blvd
                            address2: Suite 102
                            city: Waco
                            state: Texas
                            zip: '76712'
                          mailingAddress:
                            address1: null
                            address2: null
                            city: null
                            state: null
                            zip: null
                          phoneOffice: '254-555-1234'
                          phoneOfficeExt: null
                          phoneDirectLine: null
                          phoneFax: null
                          phoneMobile: null
                          useOrganizationId: null
                          connectedContacts: []
                          clients: []
                          leads: []
                          caregivers: []
                          applicants: []
                      nextPage: null
                      contactsNotFound:
                        - 99999
                    errors: []
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                403 Response:
                  value:
                    results: null
                    errors:
                      - You do not have permission to read contacts.
        '400':
          description: Bad Request - Returned when query parameters fail validation (for example, `limit` greater than 500 or less than 1).
          content:
            application/json:
              schema:
                type: object
                properties:
