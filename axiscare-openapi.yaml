      operationId: organizations.list
      description: |-
        Returns a paginated list of organizations. Supports filtering by organization IDs and statuses.

        Use `startAfterId` and `limit` for cursor-based pagination. The `nextPage` field in the response provides the URL for the next page of results when more are available.

        Requires an API token with **Organizations** read permission.
      parameters:
        - schema:
            type: string
          in: query
          name: organizationIds
          description: Comma-delimited string of organization IDs to return
        - schema:
            type: string
          in: query
          name: statuses
          description: Comma-delimited string of status labels to filter results
        - schema:
            type: integer
            minimum: 1
          in: query
          name: startAfterId
          description: Return organizations with an ID greater than this value (cursor-based pagination)
        - schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          in: query
          name: limit
          description: 'Maximum number of organizations to return. Defaults to 100, maximum 500.'
        - schema:
            type: string
            format: date
            enum:
              - '2023-10-01'
          in: header
          name: X-AxisCare-Api-Version
          description: API version
          required: true
    post:
      summary: Add Organization
      tags:
        - Organizations
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    $ref: ../Organization.yaml
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                201 Response:
                  value:
                    results:
                      id: 42
                      name: Sunrise Home Health
                      status:
                        active: true
                        label: Active
                      primaryPhone: '555-123-4567'
                      email: info@sunrisehh.com
                      physicalAddress:
                        address: 123 Main St
                        city: Austin
                        state: TX
                        zipCode: '78701'
                      permanentPriorityNotes: High priority partner
                      contacts: []
                      classes:
                        - label: Hospital
                    errors: []
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                403 Response:
                  value:
                    results: null
                    errors:
                      - You don't have permission to create this resource
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                422 Response:
                  value:
                    results: null
                    errors:
                      - "Invalid status.label 'Unknown' for status.active=true."
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                500 Response:
                  value:
                    - An internal server error occurred.
      operationId: organizations.create
      description: |-
        Create a new organization. The minimum required field is `name`.

        If `status` is omitted, the organization will be created with an active status. When providing a `status`, both `active` (boolean) and `label` (string) are required, and the label must match a configured status for the given active/inactive category.

        When providing `classes`, each label must match a configured organization class.

        Requires an API token with **Organizations** create permission.
      parameters:
        - schema:
            type: string
            format: date
            enum:
              - '2023-10-01'
          in: header
          name: X-AxisCare-Api-Version
          description: API version
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Name of the organization
                status:
                  type:
                    - object
                    - 'null'
                  description: 'Organization status. If omitted, defaults to active. If provided, must include both `active` and `label` fields.'
                  properties:
                    active:
                      type: boolean
                      description: Whether this is an active or inactive status
                    label:
                      type: string
                      description: The status label. Must match a configured status for the given active/inactive category.
                  required:
                    - active
                    - label
                primaryPhone:
                  type:
                    - string
                    - 'null'
                  description: Primary phone number
                email:
                  type:
                    - string
                    - 'null'
                  format: email
                  description: Email address
                physicalAddress:
                  type:
                    - object
                    - 'null'
                  description: Physical address of the organization
                  properties:
                    address:
                      type:
                        - string
                        - 'null'
                    city:
                      type:
                        - string
                        - 'null'
                    state:
                      type:
                        - string
                        - 'null'
                    zipCode:
                      type:
                        - string
