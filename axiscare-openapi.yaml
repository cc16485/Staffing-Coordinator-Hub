                  description: |
                    Optional ADL (Activities of Daily Living) assignments for the visit.

                    Accepts one of three forms:
                    - **Array of ADL objects** — assigns exactly these ADLs to the visit, overriding any inherited assignments.
                    - **Empty array `[]`** — explicitly assigns no ADLs (overrides schedule/client inheritance with zero ADLs).
