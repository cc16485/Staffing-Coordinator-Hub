  version: '2025-06-25'
  description: >
    ### AxisCare's Application Programming Interface (API)

    - AxisCare's API is available for customers who want to build custom functionality by connecting external systems to AxisCare.

    - If your agency wishes to utilize AxisCare's open API, you must collaborate with a development team or organization to implement.

    #### IMPORTANT:

    - AxisCare does not provide engineering or software resources to create and manage custom API integrations.
