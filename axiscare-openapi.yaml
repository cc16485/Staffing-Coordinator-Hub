                          email: info@sunrisehh.com
                          physicalAddress:
                            address: 123 Main St
                            city: Austin
                            state: TX
                            zipCode: '78701'
                          permanentPriorityNotes: null
                          contacts:
                            - name: Jane Doe
                              affiliation: Director
                          classes:
                            - label: Hospital
                      nextPage: null
                      organizationsNotFound: []
                    errors: []
        '207':
          description: Multi-Status — returned when specific organizationIds were requested and some were found while others were not
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
