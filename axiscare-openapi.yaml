  /api/classes/client:
    get:
      summary: List Client Classes
      operationId: get-client-classes
      tags:
        - Classes
      description: Returns all configured client class options. Requires an API token with **Clients** read permission.
      parameters:
        - schema:
            type: string
            format: date
            enum:
              - '2023-10-01'
          in: header
          name: X-AxisCare-Api-Version
          description: API version
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      classes:
                        type: array
                        items:
                          $ref: ../Class.yaml
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                200 Response:
                  value:
                    results:
                      classes:
                        - code: UHC
                          label: UNITED HEALTH CARE
                        - code: MEDS
                          label: MEDICATIONS
                    success: true
                    errors: [ ]
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                403 Response:
                  value:
                    results: null
                    success: false
                    errors:
                      - You don't have permission to view this resource
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                500 Response:
                  value:
                    error: Internal Server Error
