                          - 2
                          - 3
                          - 4
                        default: 0
                        description: '0 = Any time, 1 = Morning, 2 = Afternoon, 3 = Evening, 4 = Night. Defaults to 0 if not provided.'
            examples:
              Update Instructions Only:
                value:
                  instructions: Updated bathing instructions
              Update Translations Only:
                value:
