                  errors:
                    type: array
              examples:
                404 Response:
                  value:
                    results: null
                    success: false
                    errors: [The provided Client ID does not exist or is not a Client.]
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  success:
                    type: boolean
                  errors:
                    type: array
              examples:
                500 Response:
                  value:
                    results: null
                    success: false
                    errors: [ An internal server error occurred. ]
    post:
      summary: Assign ADL to Client
      description: |
        Assigns an Activity of Daily Living (ADL) to a specific client.

        The request body must include the ADL definition ID and at least one event specifying when the ADL should be performed. Only active ADLs can be assigned to a client.

        **Request fields:**
        - **id** (required): The ADL definition ID to assign (must be an active ADL)
        - **instructions** (optional): Free-text instructions
        - **translations** (optional): Object containing instruction translations keyed by language code. Only languages enabled in System Preferences are accepted. Possible keys: `es` (Spanish), `zh-CN` (Chinese Simplified), `zh-TW` (Chinese Traditional), `ru` (Russian). Omitted or null values clear the translation for that language.
          - **NOTE:** Translations can only be saved if the `instructions` field is also populated. If `instructions` is null or omitted, all translations will be cleared.
        - **events** (required): Array of scheduling events (at least one)
          - **require** (required): 1 = Always required, 2 = As needed
          - **recur** (required): Day of week (N = Sunday, M = Monday, T = Tuesday, W = Wednesday, R = Thursday, F = Friday, S = Saturday)
          - **when** (optional, defaults to 0): 0 = Any time, 1 = Morning, 2 = Afternoon, 3 = Evening, 4 = Night

        **Validation rules:**
        - When `when` is `0` (any time), each `recur` value must be unique across all events
        - When `when` is greater than `0` (specific time period), multiple events for the same `recur` day are allowed
        - When `require` is `2` (as needed), `when` must be `0` (any time) and it must be the only event for that `recur` day
      tags:
        - Clients
      operationId: clients.adls.assign
      parameters:
        - schema:
            type: string
            enum:
              - '2023-10-01'
            format: date
          in: header
          name: X-AxisCare-Api-Version
          description: API version
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - events
              additionalProperties: false
              properties:
                id:
                  type: integer
                  description: The ADL definition ID to assign to the client
                instructions:
                  type:
                    - string
                    - 'null'
                  description: Optional instructions for the caregiver
                translations:
                  type: object
                  description: 'Instruction translations keyed by language code. Only languages enabled in System Preferences are accepted. Possible keys: es (Spanish), zh-CN (Chinese Simplified), zh-TW (Chinese Traditional), ru (Russian).'
                  properties:
                    es:
                      type:
                        - string
                        - 'null'
                      description: Instructions in Spanish
                    zh-CN:
                      type:
                        - string
                        - 'null'
                      description: Instructions in Chinese (Simplified)
                    zh-TW:
                      type:
                        - string
                        - 'null'
                      description: Instructions in Chinese (Traditional)
                    ru:
                      type:
                        - string
                        - 'null'
                      description: Instructions in Russian
                events:
                  type: array
                  minItems: 1
                  description: Scheduling events specifying when the ADL should be performed
                  items:
                    type: object
                    required:
                      - require
                      - recur
                    additionalProperties: false
                    properties:
                      require:
                        type: integer
                        enum:
                          - 1
                          - 2
                        description: '1 = Always required, 2 = As needed'
                      recur:
                        type: string
                        enum:
                          - 'N'
                          - M
                          - T
                          - W
                          - R
                          - F
                          - S
                        description: 'Day of week: N = Sunday, M = Monday, T = Tuesday, W = Wednesday, R = Thursday, F = Friday, S = Saturday'
                      when:
                        type: integer
                        enum:
                          - 0
                          - 1
                          - 2
                          - 3
                          - 4
                        default: 0
                        description: '0 = Any time, 1 = Morning, 2 = Afternoon, 3 = Evening, 4 = Night. Defaults to 0 if not provided.'
            examples:
              Basic Assignment:
                value:
                  id: 1
                  instructions: Assist with bathing daily
                  translations:
                    es: Ayudar con el baño diariamente
                  events:
                    - require: 1
                      recur: M
                      when: 1
                    - require: 2
                      recur: W
                      when: 0
              Without Instructions:
                value:
                  id: 3
                  events:
                    - require: 1
                      recur: T
              Multiple Time Periods Same Day:
                value:
                  id: 2
                  events:
                    - require: 1
                      recur: M
                      when: 1
                    - require: 2
                      recur: M
                      when: 3
      responses:
        '200':
          description: Success - ADL successfully assigned to the client
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      data:
                        $ref: ../ClientADL.yaml
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                200 Response:
                  value:
                    results:
                      data:
                        id: 1
                        key: bathing
                        name: Bathing
                        category: Personal Care
                        instructions: Assist with bathing daily
                        translations:
                          es: Ayudar con el baño diariamente
                          ru: Помочь с ежедневным купанием
                        events:
                          - require: 1
                            recur: M
                            when: 1
                            frequency: specific_time
                            time_period: morning
                          - require: 2
                            recur: W
                            when: 0
                            frequency: as_needed
                            time_period: any_time
                    success: true
                    errors: []
        '400':
          description: Bad Request - Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                400 Response - Missing Required Field:
                  value:
                    results: null
                    success: false
                    errors:
                      - 'Invalid input: id: The data (null) must match the type: integer'
                400 Response - ADL Already Assigned:
                  value:
                    results: null
                    success: false
                    errors:
                      - This ADL is already assigned to the client.
                400 Response - ADL Does Not Exist:
                  value:
                    results: null
                    success: false
                    errors:
                      - The provided ADL ID does not exist.
                400 Response - ADL Is Not Active:
                  value:
                    results: null
                    success: false
                    errors:
                      - The provided ADL is not active.
                400 Response - Duplicate Recur:
                  value:
                    results: null
                    success: false
                    errors:
                      - "Invalid input: events: duplicate recur value 'M' is not allowed when when=0 (any time)"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                403 Response:
                  value:
                    results: null
                    success: false
                    errors:
                      - You don't have permission to perform this action.
        '404':
          description: Not Found - The provided Client ID does not exist or is not a Client
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  success:
                    type: boolean
                  errors:
