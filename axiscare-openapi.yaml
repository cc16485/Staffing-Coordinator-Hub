  '/api/notes/{entityType}':
    parameters:
      - schema:
          type: string
          enum:
            - client
            - lead
            - caregiver
            - applicant
        name: entityType
        in: path
        required: true
        description: 'The type of entity'
    get:
      summary: List Notes by Entity Type
      operationId: notes.get-list-by-type
      tags:
        - Notes
      description: |
        Returns notes for a given entity type, sorted by date in descending order (most recent first).
  
        If more results match than what the endpoint is set to return, a URL to the next page of results will be provided in the response. Note that a Lead can be converted to a Client and an Applicant converted to a Caregiver, so Clients and Caregivers may have a different types of notes on their profiles.

        The user must have the appropriate permission for the entity type being accessed:
        - `client` requires access to Clients
        - `lead` requires access to Leads
        - `caregiver` requires access to Caregivers
        - `applicant` requires access to Applicants
      parameters:
        - schema:
            type: string
            format: date
            enum:
              - '2023-10-01'
          in: header
          name: X-AxisCare-Api-Version
          description: API version
          required: true
        - schema:
            type: string
          in: query
          name: nextPageToken
          description: Pagination cursor returned in the previous page's nextPage URL.
        - schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 100
          in: query
          name: limit
          description: Limit the number of notes returned
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      notes:
                        type: array
                        items:
                          $ref: ../Note.yaml
                      nextPage:
                        type:
                          - string
                          - 'null'
                        description: URL to the next page of results, or null if there are no more pages
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                200 Response:
                  value:
                    results:
                      notes:
                        - id: 42
                          dateTime: '2025-07-01T15:23:45'
                          important: false
                          note: Patient requires follow-up visit next week
                          author:
                            name: Jim Carrey
                          entity:
                            id: 789
                            type: client
                          categories:
                            - id: 3
                              name: Clinical
                        - id: 41
                          dateTime: '2025-06-28T10:00:00'
                          important: true
                          note: Urgent care needed
                          author:
                            name: Chrissy Lund
                          entity:
                            id: 790
                            type: client
                          categories: []
                      nextPage: 'https://1234.axiscare.com/api/notes/client?nextPageToken=NDE%3D&limit=2'
                    success: true
                    errors: []
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                400 Response:
                  value:
                    results: null
                    success: false
                    errors:
