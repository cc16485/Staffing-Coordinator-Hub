          required: true
  '/api/visits/{visitId}':
    parameters:
      - name: visitId
        in: path
        required: true
        description: |
          Visit identifier in schedule-key format. Use either:
          - **Schedule key** (uninstantiated): `s={scheduleId}:d={date}` (e.g. `s=7:d=2026-10-10`)
          - **Full key** (instantiated): `v={visitId}:s={scheduleId}:d={date}` (e.g. `v=12345:s=7:d=2026-10-10`)
          Date must be `YYYY-MM-DD`. URL-encode the value if needed (e.g. `=` as `%3D`).
        schema:
          type: string
          pattern: '^(v=\d+:)?s=\d+:d=\d{4}-\d{2}-\d{2}$'
          example: s=7:d=2026-10-10
