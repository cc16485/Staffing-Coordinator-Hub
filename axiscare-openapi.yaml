  '/api/clients/{clientId}/responsibleParties':
    parameters:
      - schema:
          type: integer
        name: clientId
        in: path
        required: true
        description: Client ID
    get:
      summary: List Responsible Parties
      description: |
        Retrieves a complete list of all responsible parties associated with a specific client.
        
        Responsible parties are individuals who have legal, financial, or caregiving responsibilities for the client. These may include family members, legal guardians, power of attorney holders, or other authorized representatives. Each responsible party is assigned a specific list number (1-3) that indicates their priority level, with comprehensive contact information, relationship details, and authorization levels.
        
        Responsible Party Positions:
        - List Number 1: Primary Responsible Party (most important contact)
        - List Number 2: Secondary Responsible Party (backup contact)
        - List Number 3: Tertiary Responsible Party (additional contact)
        
        Key features:
        - **Always returns exactly 3 responsible parties** (list numbers 1, 2, 3), regardless of how many exist
        - Empty positions are filled with minimal data (listNumber and default/empty values)
        - Returns all responsible parties in list number order (1, 2, 3)
        - Includes full contact information (address, phone numbers, email)
        - Shows relationship to client and authorization levels
        - Indicates HIPAA disclosure permissions and medical decision-making authority
        
        Common use cases:
        - Displaying complete contact information for care coordination
        - Identifying authorized persons for HIPAA communications
        - Determining who can make medical decisions for the client
        - Managing emergency contacts and family relationships
      tags:
        - Clients
      operationId: clients.responsible-parties.list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: ../ResponsibleParty.yaml
                  errors:
                    type:
                      - array
                      - 'null'
                    items: {}
              examples:
                Example 1:
                  value:
                    results:
                      - listNumber: '1'
                        name: John Doe
                        relationship: Spouse
                        email: john.doe@example.com
                        dateOfBirth: '1970-01-01'
                        hipaaDisclosureAuthorization: '1'
                        canMakeMedicalDecisions: '1'
                        address:
                          line1: 123 Main St
                          line2: Apt 4B
                          city: Anytown
                          state: CA
                          zip: '90210'
                        phones:
                          - type: Mobile
                            number: '555-0101'
                          - type: Other
                            number: ''
                      - listNumber: '2'
                        name: Jane Smith
                        relationship: Parent
                        email: jane.smith@example.com
                        dateOfBirth: '1965-05-15'
                        hipaaDisclosureAuthorization: '0'
                        canMakeMedicalDecisions: '0'
                        address:
                          line1: 456 Oak Ave
                          line2: ''
                          city: Somewhere
                          state: NY
                          zip: '10001'
                        phones:
                          - type: Home
                            number: '555-0102'
                          - type: Other
                            number: ''
                      - listNumber: '3'
                        name: ''
                        relationship: ''
                        email: ''
                        dateOfBirth: ''
                        hipaaDisclosureAuthorization: ''
                        canMakeMedicalDecisions: ''
                        address:
                          line1: ''
                          line2: ''
                          city: ''
                          state: ''
                          zip: ''
                        phones:
                          - type: Other
                            number: ''
                          - type: Other
                            number: ''
                    errors: null
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  errors:
                    type: array
                    items:
                      type: string
        '403':
          description: Forbidden
        '404':
          description: Not Found
      parameters:
        - schema:
            type: string
            enum:
              - '2023-10-01'
            format: date
          in: header
          name: X-AxisCare-Api-Version
          description: API version
          required: true
