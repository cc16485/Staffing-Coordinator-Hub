        '400':
          description: |
            Bad Request — returned when the request body cannot be parsed, or when a required modification reason is missing.

            **Invalid JSON:**
            - `Cannot parse request body: invalid JSON.`
            - `At least one field must be provided for the update.`

            **Modification reason required** (only when the *Require modification reasons* option in System Preference is enabled and the visit does not already have a modification reason stored):
            - `A modification reason is required.`
          content:
