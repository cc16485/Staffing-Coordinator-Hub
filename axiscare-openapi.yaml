    patch:
      summary: Update Client ADL
      description: |
        Updates an existing Activity of Daily Living (ADL) assignment for a specific client. Only active ADLs can be updated.

        This endpoint allows partial updates — you can update instructions, translations, events, or any combination. At least one of these fields must be provided.

        **Request fields:**
        - **instructions** (optional): Free-text instructions for the caregiver. Pass `null` to clear existing instructions.
        - **translations** (optional): Object containing instruction translations keyed by language code. Only languages enabled in System Preferences are accepted. Possible keys: `es` (Spanish), `zh-CN` (Chinese Simplified), `zh-TW` (Chinese Traditional), `ru` (Russian). Only provided keys are updated; omitted keys retain their existing value. Pass `null` for a key to clear that translation.
        - **events** (optional): Array of scheduling events (at least one if provided). When provided, replaces all existing events.
          - **require** (required): 1 = Always required, 2 = As needed
          - **recur** (required): Day of week (N = Sunday, M = Monday, T = Tuesday, W = Wednesday, R = Thursday, F = Friday, S = Saturday)
          - **when** (optional, defaults to 0): 0 = Any time, 1 = Morning, 2 = Afternoon, 3 = Evening, 4 = Night

        **Validation rules:**
        - At least one of `instructions`, `translations`, or `events` must be provided
        - When `when` is `0` (any time), each `recur` value must be unique across all events
        - When `when` is greater than `0` (specific time period), multiple events for the same `recur` day are allowed
        - The ADL must already be assigned to the client
      tags:
        - Clients
      operationId: clients.adls.update
      parameters:
        - schema:
            type: string
            enum:
              - '2023-10-01'
