                    **Validation rules:**
                    - Each ADL object must include either `adlKey` or `id` (or both). When both are provided, they must refer to the same ADL definition.
                    - `adlKey` and `id` values must each be unique within the `adls` list; the same ADL cannot be assigned more than once on a single visit.
                    - Each ADL object must include at least one `events` entry.
                    - Each event's stored weekday code is taken from `visitDate` (N = Sunday through S = Saturday). Do not send `recur` on events; it is not accepted.
                    - Each ADL must be assignable to the visit based on the client and service configuration. An error is returned if the ADL is not valid for the visit context.
                    - `translations` values are only persisted when `instructions` is also provided. Omitted or `null` translation values clear that language.
