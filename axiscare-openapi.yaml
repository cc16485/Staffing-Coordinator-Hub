      description: |-
        This endpoint allows you to modify an existing schedule by its ID. You can supply a partial payload of only the keys you want to update, but a minimum of 1 field is required.

        Only the fields documented below will be accepted; supply extraneous fields will return a `400 BAD REQUEST`, and no updates will be performed to the schedule.

        If updating the service, you may specify *either* a service code *or* a description, but not both.

        If updating `startTime`, `endTime`, `startDate`, or `endDate`, it is required that start <= end.

        The fields `caregiverId` and `endDate` can be `null`. When `null` is passed to `caregiverId`, the caregiver will be unassigned from all visits prodcued by this schedule. When `null` is passed to `endDate`, this schedule will recur indefinitely.

        If no schedule exists for the given ID, or the client attached to the schedule is inactive, the endpoint returns `404 NOT FOUND`.
      parameters:
        - schema:
            type: string
            enum:
              - '2023-10-01'
            format: date
          in: header
          name: X-AxisCare-Api-Version
          description: API version
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                caregiverId:
                  type:
                    - integer
