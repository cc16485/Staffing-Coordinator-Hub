  '/api/leads/{leadId}/responsibleParties':
    parameters:
      - schema:
          type: integer
        name: leadId
        in: path
        required: true
        description: Lead ID
    get:
      summary: List Responsible Parties
      description: |
        Retrieves a complete list of all responsible parties associated with a specific lead.

        Responsible parties are individuals who have legal, financial, or caregiving responsibilities for the lead. These may include family members, legal guardians, power of attorney holders, or other authorized representatives. Each responsible party is assigned a specific list number (1-3) that indicates their priority level, with comprehensive contact information, relationship details, and authorization levels.

        Responsible Party Positions:
        - List Number 1: Primary Responsible Party (most important contact)
        - List Number 2: Secondary Responsible Party (backup contact)
        - List Number 3: Tertiary Responsible Party (additional contact)

        Key features:
        - **Always returns exactly 3 responsible parties** (list numbers 1, 2, 3), regardless of how many exist
        - Empty positions are filled with minimal data (listNumber and default/empty values)
        - Returns all responsible parties in list number order (1, 2, 3)
        - Includes full contact information (address, phone numbers, email)
        - Shows relationship to lead and authorization levels
        - Indicates HIPAA disclosure permissions and medical decision-making authority

        Common use cases:
        - Displaying complete contact information for care coordination during lead qualification
        - Identifying authorized persons for HIPAA communications
        - Determining who can make medical decisions for the lead
        - Managing emergency contacts and family relationships during intake process
        - Facilitating smooth transition from lead to client status
      tags:
        - Leads
      operationId: leads.responsible-parties.list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: ../ResponsibleParty.yaml
                  errors:
                    type:
                      - array
                      - 'null'
                    items: {}
              examples:
                Example 1:
                  value:
                    results:
                      - listNumber: '1'
                        name: Lead Guardian
                        relationship: Legal Guardian
                        email: guardian@example.com
                        dateOfBirth: '1955-12-25'
                        hipaaDisclosureAuthorization: '1'
                        canMakeMedicalDecisions: '1'
