  /api/tokens/expiring:
    get:
      summary: List Expiring Tokens
      tags:
        - Expiring Tokens
      operationId: get-expiring-tokens
      description: |-
        Returns a paginated list of active API tokens that expire within the next 30 days. Revoked and already-expired tokens are not included.

        Use `nextPageToken` and `limit` for cursor-based pagination. The `nextPage` field in the response provides the URL for the next page of results (including its `nextPageToken`) when more are available.

        Requires an API token with **Expiring Tokens** read permission.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      expiringTokens:
                        type: array
                        items:
                          $ref: ../ExpiringToken.yaml
                      nextPage:
                        type:
                          - string
                          - 'null'
                        description: 'If more results match than what the endpoint is set to return, a URL to the next page of results will be provided here.'
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                200 Response:
                  value:
                    results:
                      expiringTokens:
                        - name: Reporting integration key
                          expirationDate: '2026-08-01'
                        - name: Scheduling sync key
                          expirationDate: '2026-08-09'
                      nextPage: null
                    errors: []
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                400 Response:
                  value:
                    results: null
                    errors:
                      - Limit cannot exceed 500
                400 Response (invalid cursor):
                  value:
                    results: null
                    errors:
                      - Invalid nextPageToken
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: 'null'
                  errors:
                    type: array
                    items:
                      type: string
              examples:
                403 Response:
                  value:
                    results: null
                    errors:
                      - You don't have permission to view this resource
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                500 Response:
                  value:
                    - An internal server error occurred.
      parameters:
        - schema:
            type: string
          in: query
          name: nextPageToken
          description: Opaque pagination cursor taken from the `nextPage` URL of the previous response. Do not construct this value manually.
        - schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          in: query
          name: limit
          description: 'Maximum number of tokens to return. Defaults to 100, maximum 500.'
        - schema:
            type: string
            format: date
            enum:
              - '2023-10-01'
          in: header
          name: X-AxisCare-Api-Version
          description: API version
          required: true
