    get:
      summary: Get Responsible Party
      description: |
        Retrieves detailed information for a specific responsible party identified by their list number (which represents their position) for a lead.

        Each responsible party has a list number (1-3) that corresponds to their position within the lead's responsible party hierarchy. List number 1 is the Primary contact, list number 2 is Secondary, and list number 3 is Tertiary. This endpoint returns complete information including contact details, relationship, and authorization levels for the specified responsible party.

        Key information returned:
        - Complete contact information (name, address, phone numbers, email)
        - Relationship to the lead (spouse, parent, guardian, etc.)
        - HIPAA disclosure authorization status
        - Medical decision-making authority
        - Date of birth if provided

        Common use cases:
        - Retrieving specific contact information during lead qualification
        - Checking authorization levels before sharing lead information
        - Verifying responsible party details before important communications
        - Displaying individual responsible party profiles in lead management interfaces
        - Validating contact information during lead intake processes

        Error handling:
        - Returns 404 if the lead doesn't exist
        - Returns 404 if the specified list number (1-3) doesn't exist for this lead
        - Returns 400 if the list number is invalid (must be 1, 2, or 3)
      tags:
        - Leads
      operationId: leads.responsible-parties.get-single
      responses:
