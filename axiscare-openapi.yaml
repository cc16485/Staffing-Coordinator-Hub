      description: |-
        This endpoint allows you to add a visit. The minimum required information is a client ID, a caregiver ID, a visit date, a start time, and an end time. To create an unassigned visit, pass `null` for `caregiverId` (the field must still be present in the request body). You may specify *either* a service code *or* a description, but not both.  It also supports a custom billable rate property that you add to the request body:

        `"billableRateMode": "custom"`.

        When using the custom billable mode, you will need to provide a `chargeRate`:

        `"chargeRate": 120.45`

        ### ADL Assignments

        You may include an `adls` field to assign Activities of Daily Living to the visit. ADLs define tasks that caregivers should perform during the visit.

        **Three modes are supported:**

        | Value | Behavior |
        |---|---|
        | Array of ADL objects | Assigns exactly these ADLs, overriding inherited assignments |
        | Empty array `[]` | Explicitly assigns no ADLs (overrides inheritance) |
        | String `"inherit"` | Removes visit-level overrides; visit inherits ADLs from schedule or client |

        **Key validation rules:**
        - Each ADL must include `adlKey` or `id` (or both). If both are given they must refer to the same ADL.
        - `adlKey` and `id` values must each be unique across the `adls` list; the same ADL cannot be assigned more than once on a single visit.
        - Each ADL must have at least one event in `events`.
        - Event weekday codes are derived from `visitDate`; `recur` must not be sent on `events` items.
        - Only ADLs assignable to the visit (based on client and service configuration) are accepted.
        - Instruction `translations` are only saved when `instructions` is also provided.

        ### Care Notes

        `careNote` is **not supported** when creating a visit. Including `careNote` in the request body returns a `400` error. Care notes can only be added or modified after the visit has started, via `PATCH /api/visits/{visitId}`.
