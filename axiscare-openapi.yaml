                  description: 'Instruction translations keyed by language code. Only languages enabled in System Preferences are accepted. Only provided keys are updated; omitted keys retain their existing value.'
                  properties:
                    es:
                      type:
                        - string
                        - 'null'
                      description: Instructions in Spanish
